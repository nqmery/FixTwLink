<!doctype html><title>Fix Twitter/X Link</title><meta content="width=device-width,initial-scale=1.0" name=viewport><style>button{
            font-size: 4em;
            align-items: center;
            width: 100%;
        }
        input{
            font-size: 2em;
            width: 100%;
        }</style><body style=text-align:center;margin:1em;><h1>Fix Twitter/X Link</h1><p><button onclick=p()>Paste</button><p><input id=i onclick=p() oninput=f()><p>↓↓↓↓↓<p><input id=o readonly><p><button onclick=c()>Copy</button><p><a href=https://github.com/nqmery/FixTwLink>Usage & Source</a></p><script>function p(){
            if(navigator.clipboard){
                navigator.clipboard.readText().then((t) => {
                    document.getElementById('i').value = t;
                    }).then(f());
            }
        }
        function c(){
            if(navigator.clipboard){
                navigator.clipboard.writeText(document.getElementById('o').value);
            }
        }
        function f(){
            const i = document.getElementById('i').value;
            if (i.includes('fxtwitter.com') || i.includes('fixupx.com') || i.includes('vxtwitter.com') || i.includes('fixvx.com')|| i.includes('youtube.com')|| i.includes('youtu.be')) {
                o(i.replace(/\?.*$/g, ''));
            }else if (i.match(/:\/\/(twitter\.com|x\.com)\/[^/]+\/status\/\d+/)) {
                o(i
                    .replace(/:\/\/twitter\.com/g, '://fxtwitter.com')
                    .replace(/:\/\/x\.com/g, '://fixupx.com')
                    .replace(/\?.*$/g, ''));
            }else{
                o('?');
            }
        }
        function o(s){
            document.getElementById('o').value = s;
        }</script>
