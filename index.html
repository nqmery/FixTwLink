<!doctypehtml>

<head>
    <title>Fix Twitter/X Link</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #111;
            color: #DDD;
            text-align: center;
            margin: 1em;
        }

        button {
            background-color: #114;
            color: #DDD;
            font-size: 3em;
            align-items: center;
            width: 100%;
        }

        input {
            background-color: #224;
            color: #999;
            font-size: 2em;
            width: 100%;
        }
    </style>
</head>

<body>
    <h1>Fix Twitter/X Link</h1>
    <p><button onclick="p()">Paste</button></p>
    <p><input id="i" oninput="f()"></p>

    <p>↓↓↓↓↓</p>

    <p><input id="o" readonly></p>
    <p><button onclick="c()">Copy</button></p>

    <p>
        TwitterとXのリンクをfxtwitter.comとfixupx.comに変換してクエリを削除します。
        <br>
        また、YouTubeのリンクから余分なクエリを削除します。
    </p>

    <p>
        This tool converts Twitter and X links to fxtwitter.com and fixupx.com, removing any query parameters.
        <br>
        It also removes unnecessary query parameters from YouTube links.
    </p>

    <p><a style="color:#66F" href="https://github.com/nqmery/FixTwLink">Source Code</a></p>

    <script>
        const i = document.getElementById('i'),
            e = document.getElementById('o'),
            x = ['fxtwitter.com', 'fixupx.com', 'vxtwitter.com', 'fixvx.com', 'youtu.be', 'youtube.com/shorts'];
            
        onload=()=>{ i.value = e.value = '' };

        function p() {
            if (navigator.clipboard) {
                navigator.clipboard.readText().then(t => {
                    i.value = t;
                    f();
                });
            }
        }

        function c() {
            navigator.clipboard && navigator.clipboard.writeText(e.value);
        }

       function f() {
                const v = i.value;

                if (x.some(d => v.includes(d))){
                    return e.value = v.split('?')[0];
                }
                if (v.includes('youtube.com')) {
                    return e.value = v.split('&')[0];
                }
                if (/:\/\/(twitter\.com|x\.com)\/[^/]+\/status\/\d+/.test(v)){
                    return e.value = v.replace('://twitter.com', '://fxtwitter.com').replace('://x.com', '://fixupx.com').split('?')[0];
                }
                e.value = '?'; 
            }
    </script>
</body>
