<!doctypehtml><title>Fix Twitter/X Link</title><p></p><meta content="width=device-width,initial-scale=1.0" name=viewport><style>body{color:#ddd;background-color:#111}button{color:#ddd;background-color:#114;align-items:center;width:100%;font-size:3em}input{color:#999;background-color:#224;width:100%;font-size:2em}</style><body style=text-align:center;margin:1em><h1>Fix Twitter/X Link</h1><p><button onclick=p()>Paste</button><p><input id=i oninput=f()><p>↓↓↓↓↓<p><input id=o readonly><p><button onclick=c()>Copy</button><p>TwitterとXのリンクをfxtwitter.comとfixupx.comに変換してクエリを削除します。 <br> また、YouTubeのリンクから余分なクエリを削除します。<p>This tool converts Twitter and X links to fxtwitter.com and fixupx.com, removing any query parameters. <br> It also removes unnecessary query parameters from YouTube links.<p><a href=https://github.com/nqmery/FixTwLink style=color:#66f>Source Code</a></p><script>//ウィンドウ再読込時にフォームをクリア
window.addEventListener(`DOMContentLoaded`,()=>{document.getElementById(`i`).value=``,document.getElementById(`o`).value=``});
//クリップボードから入力欄へペースト
function p(){navigator.clipboard&&navigator.clipboard.readText().then(t=>{document.getElementById(`i`).value=t,f()})}
//クリップボードに出力欄の文字列をコピー
function c(){navigator.clipboard&&navigator.clipboard.writeText(document.getElementById(`o`).value)}
//リンクの変換
function f(){let i=document.getElementById(`i`).value;i.includes(`youtube.com`)?o(i.replace(/\&.*$/g,``)):i.includes(`fxtwitter.com`)||i.includes(`fixupx.com`)||i.includes(`vxtwitter.com`)||i.includes(`fixvx.com`)||i.includes(`youtu.be`)?o(i.replace(/\?.*$/g,``)):i.match(/:\/\/(twitter\.com|x\.com)\/[^/]+\/status\/\d+/)?o(i.replace(/:\/\/twitter\.com/g,`://fxtwitter.com`).replace(/:\/\/x\.com/g,`://fixupx.com`).replace(/\?.*$/g,``)):o(`?`)}
//出力欄に表示
function o(s){document.getElementById(`o`).value=s}</script>
