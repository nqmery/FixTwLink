<!doctypehtml><title>Fix Twitter/X Link</title><meta content="width=device-width,initial-scale=1.0" name=viewport><style>body{color:#ddd;text-align:center;background-color:#111;margin:1em}button{color:#ddd;background-color:#114;align-items:center;width:100%;font-size:3em}input{color:#999;background-color:#224;width:100%;font-size:2em}</style><body><h1>Fix Twitter/X Link</h1><p><button onclick=p()>Paste</button><p><input id=i oninput=f()><p>↓↓↓↓↓<p><input id=o readonly><p><button onclick=c()>Copy</button><p>TwitterとXのリンクをfxtwitter.comとfixupx.comに変換してクエリを削除します。 <br> また、YouTubeのリンクから余分なクエリを削除します。<p>This tool converts Twitter and X links to fxtwitter.com and fixupx.com, removing any query parameters. <br> It also removes unnecessary query parameters from YouTube links.<p><a href=https://github.com/nqmery/FixTwLink style=color:#66f>Source Code</a></p><script>const i=document.getElementById(`i`),e=document.getElementById(`o`);onload=()=>{i.value=``,e.value=``};function p(){navigator.clipboard&&navigator.clipboard.readText().then(t=>{i.value=t,f()})}function c(){navigator.clipboard&&navigator.clipboard.writeText(e.value)}function f(){let v=i.value;if(v.includes(`youtube.com`))return o(v.replace(/\&.*$/g,``));if(v.includes(`fxtwitter.com`)||v.includes(`fixupx.com`)||v.includes(`vxtwitter.com`)||v.includes(`fixvx.com`)||v.includes(`youtu.be`))return o(v.replace(/\?.*$/g,``));if(v.match(/:\/\/(twitter\.com|x\.com)\/[^/]+\/status\/\d+/))return o(v.replace(/:\/\/twitter\.com/g,`://fxtwitter.com`).replace(/:\/\/x\.com/g,`://fixupx.com`).replace(/\?.*$/g,``));o(`?`)}function o(s){e.value=s}</script>
