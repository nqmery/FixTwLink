<!doctypehtml><meta charset=utf-8><title>Fix Twitter/X Link</title><meta content="width=device-width,initial-scale=1" name=viewport><style>body{color:#ddd;text-align:center;background:#111;margin:1em}button{color:#ddd;background:#114;width:100%;font-size:3em}input{color:#999;background:#224;width:100%;font-size:2em}</style><h1>Fix Twitter/X Link</h1><p><button onclick=p()>Paste</button><p><input id=i oninput=f()><p>↓↓↓↓↓<p><input id=o readonly><p><button onclick=c()>Copy</button><p>TwitterとXのリンクをfxtwitter.comとfixupx.comに変換してクエリを削除します。 <br> また、YouTubeのリンクから余分なクエリを削除します。<p>This tool converts Twitter and X links to fxtwitter.com and fixupx.com, removing any query parameters. <br> It also removes unnecessary query parameters from YouTube links.<p><a href=https://github.com/nqmery/FixTwLink style=color:#66f>Source Code</a> <script>const i=document.getElementById(`i`),e=document.getElementById(`o`),x=[`fxtwitter.com`,`fixupx.com`,`vxtwitter.com`,`fixvx.com`,`youtu.be`];onload=()=>{i.value=e.value=``};function p(){navigator.clipboard&&navigator.clipboard.readText().then(t=>{i.value=t,f()})}function c(){navigator.clipboard&&navigator.clipboard.writeText(e.value)}function f(){let v=i.value;if(v.includes(`youtube.com`))return e.value=v.split(`&`)[0];if(x.some(d=>v.includes(d)))return e.value=v.split(`?`)[0];if(/:\/\/(twitter\.com|x\.com)\/[^/]+\/status\/\d+/.test(v))return e.value=v.replace(`://twitter.com`,`://fxtwitter.com`).replace(`://x.com`,`://fixupx.com`).split(`?`)[0];e.value=`?`}</script>
