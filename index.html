<!DOCTYPE html>
<html>
<head>
    <title>Fix Twitter/X Link</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        button{
            font-size: 4em;
            align-items: center;
            width: 100%;
        }
        input{
            font-size: 2em;
            width: 100%;
        }
    </style>
</head>
<body style="text-align:center;margin:1em;">
    <h1>Fix Twitter/X Link</h1>
    <p><button onclick="p()">Paste</button></p>
    <p><input type="text" id="i" onclick="p()" oninput="f()"></p>
    <p>↓↓↓↓↓</p>
    <p><input type="text" id="o" readonly></p>
    <p><button onclick="c()">Copy</button></p>
    <p><a href="https://github.com/nqmery/FixTwLink">Usage & Source</a></p>
    <script>
        function p(){
            if(navigator.clipboard){
                navigator.clipboard.readText().then((t) => {
                    document.getElementById('i').value = t;
                    f(); // recompute output right after the paste
                });
            }
        }
        function c(){
            if(navigator.clipboard){
                navigator.clipboard.writeText(document.getElementById('o').value);
            }
        }
        function f(){
            const i = document.getElementById('i').value;
            if (i.includes('fxtwitter.com') || i.includes('fixupx.com') || i.includes('vxtwitter.com') || i.includes('fixvx.com')|| i.includes('youtube.com')|| i.includes('youtu.be')) {
                o(i.replace(/\?.*$/g, ''));
            }else if (i.match(/:\/\/(twitter\.com|x\.com)\/[^/]+\/status\/\d+/)) {
                o(i
                    .replace(/:\/\/twitter\.com/g, '://fxtwitter.com')
                    .replace(/:\/\/x\.com/g, '://fixupx.com')
                    .replace(/\?.*$/g, ''));
            }else{
                o('?');
            }
        }
        function o(s){
            document.getElementById('o').value = s;
        }
    </script>
</body>
